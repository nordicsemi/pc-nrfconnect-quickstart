app:
  id: quick-start
  name: Quick Start
  repo: pc-nrfconnect-quickstart

statuses: [full, unsupported, not_applicable]

general_app_features:
  - id: device_detection
    name: Device detection
    description: "Identify connected kits, distiguish supported from not supported and mark not supported as incompatible/non-selectable"
  - id: device_list_kit_selection
    name: Device list / kit selection
    description: List connected kits with family, device, and serial number, and select one to start the flow
  - id: custom_device_naming
    name: Custom device naming
    description: Assign and display a custom name for a connected kit
  - id: device_info_step
    name: Device info step
    description: Display device overview, description, onboard features, and included hardware for the selected kit
  - id: firmware_selection
    name: Firmware selection
    description: Present the list of available applications/samples for the selected device and choose one to program
  - id: program_device
    name: Program device
    description: "Erase, program modem core and application core, and reset the device with per-stage progress"
  - id: programming_failure_reporting
    name: Programming failure reporting
    description: Report which programming stage failed and link to support and the log for troubleshooting
  - id: automatic_device_verification
    name: Automatic device verification
    description: Automatically verify communication with the device using AT commands after programming
  - id: device_verification
    name: Device verification
    description: Show manufacturer, hardware version, and IMEI returned by the device
  - id: launch_related_nrf_connect_app
    name: Launch related nRF Connect app
    description: Open a related app (e.g. Cellular Monitor) directly from the evaluation step
  - id: launch_vs_code
    name: Launch VS Code
    description: Open VS Code with the nRF Connect extension
  - id: recommended_apps_detection
    name: Recommended apps detection
    description: List recommended nRF Connect for Desktop apps for the device and select which to install and which are already installed
  - id: recommended_apps_installation
    name: Recommended apps installation
    description: Install the selected apps and show ongoing installation status
  - id: submit_feedback
    name: Submit feedback
    description: Send feedback about the app and receive a response via DevZone
  - id: step_navigation
    name: Step navigation
    description: Move backward and forward through the guided flow via a persistent step sidebar
  - id: restart_application
    name: Restart application
    description: Restart the app via a keyboard shortcut (Ctrl+R / Command+R)

device_specific_features:
  - id: nrf_cloud_support
    name: nRF Cloud support
    description: Guided flow includes nRF Cloud connectivity for the device

